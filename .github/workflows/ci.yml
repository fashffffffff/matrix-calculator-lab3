name: Matrix Calculator CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ doxygen graphviz valgrind
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build library, application and tests
        run: cmake --build build --parallel 2
      - name: Run CTest
        run: ctest --test-dir build --verbose --output-on-failure
      - name: Check memory with Valgrind
        run: >
          valgrind --leak-check=full --show-leak-kinds=all
          --errors-for-leak-kinds=all --error-exitcode=1
          ./build/tests/matrix_tests
      - name: Generate Doxygen documentation
        run: doxygen Doxyfile
      - name: Build Docker image
        run: docker build --tag matrix-calculator .
      - name: Run container smoke test
        run: |
          docker run --rm matrix-calculator > container-output.txt
          cat container-output.txt
          grep -F '19.00  22.00' container-output.txt
          grep -F 'Random matrix 3x4' container-output.txt
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: matrix-calculator-documentation
          path: docs/html/
          if-no-files-found: error
